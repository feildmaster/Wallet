<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wallet - feildmaster.com</title>

    <!-- update the version number as needed -->
    <script defer src="/__/firebase/8.10.1/firebase-app.js"></script>
    <!-- include only the Firebase features as you need -->
    <script defer src="/__/firebase/8.10.1/firebase-auth.js"></script>
    <script defer src="/__/firebase/8.10.1/firebase-firestore.js"></script>
    <script defer src="/__/firebase/8.10.1/firebase-functions.js"></script>
    <script defer src="/__/firebase/8.10.1/firebase-analytics.js"></script>
    <!-- <script defer src="/__/firebase/8.10.1/firebase-remote-config.js"></script> -->
    <!-- <script defer src="/__/firebase/8.10.1/firebase-performance.js"></script> -->
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>

    <script type="module" src="./assets/js/modules.js"></script>
    <script type="module" src="https://auth.feildmaster.com/token.js?listen"></script>

    <link href="./assets/css/style.css" media="screen" rel="stylesheet"/>
  </head>
  <body>
    <header>
      <section class="flex-grow">feildmaster.com - Wallet</section>
      <section>
        <button id="user" type="button" popovertarget="userMenu" class="menu-trigger authed username"></button>
        <button id="login" type="button" popovertarget="loginMenu" class="menu-trigger unauthed">Log In</button>
      </section>
    </header>
    <article class="authed">
      <h1>
        Account History
        <div class="header-info">FMCoins <span class="currency balance" data-type="FMC">0</span></div>
      </h1>
      <section id="history"></section>
    </article>
    <div id="userMenu" popover class="menu">
      <div class="currency balance" data-type="FMC">0</div>
      <button type="button" class="open-linked">Linked accounts</button>
      <button type="button" class="logout">Sign Out</button>
    </div>
    <div id="loginMenu" popover class="menu">
      <button type="button" data-provider="google">Google</button>
      <button type="button" data-provider="github">Github</button>
      <button type="button" data-provider="discord">Discord</button>
    </div>
    <dialog id="linkedDialog" aria-labelledby="linkedTitle">
      <div class="dialog-body">
        <h2 id="linkedTitle">Linked accounts</h2>
        <p class="dialog-note">Link the accounts you sign in with, even if they use different email addresses, and they all open this same wallet.</p>
        <div class="linked-row" data-provider="google">
          <span class="provider-name">Google</span>
          <span class="status" hidden>Linked</span>
          <button type="button" class="link" hidden>Link</button>
        </div>
        <div class="linked-row" data-provider="github">
          <span class="provider-name">Github</span>
          <span class="status" hidden>Linked</span>
          <button type="button" class="link" hidden>Link</button>
        </div>
        <div class="linked-row" data-provider="discord">
          <span class="provider-name">Discord</span>
          <span class="status" hidden>Linked</span>
          <button type="button" class="link" hidden>Link</button>
        </div>
        <div class="link-error" role="alert" hidden></div>
        <form method="dialog" class="dialog-actions">
          <button type="submit">Close</button>
        </form>
      </div>
    </dialog>
    <template id="entry">
      <div class="entry">
        <div class="memo"></div>
        <div class="currency"></div>
        <div class="date"></div>
      </div>
    </template>
  </body>
</html>
